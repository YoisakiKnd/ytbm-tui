[package]
name = "ytbm-tui"
version = "0.1.0"
edition = "2021"
description = "Lightweight YouTube Music TUI client (ad-free playback via mpv + yt-dlp)"
license = "GPL-3.0-only"

[dependencies]
ratatui = "0.30"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "process", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "6"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
async-trait = "0.1"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
unicode-width = "0.2"
rustypipe = { version = "0.11.4", features = ["userdata"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
# chafa-dyn (a default feature) needs the native chafa C library via
# pkg-config, which Windows does not have — the built-in halfblock renderer
# covers the same fallback role.
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
